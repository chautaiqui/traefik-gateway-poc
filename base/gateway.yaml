apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: traefik-poc
spec:
  controllerName: traefik.io/gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: traefik-poc
  namespace: traefik-poc
spec:
  gatewayClassName: traefik-poc
  listeners:
    - name: http
      protocol: HTTP
      port: 8000
      allowedRoutes:
        namespaces:
          from: Same
    # F10 TLS termination — HTTPS listener on the websecure entrypoint (8443).
    - name: https
      protocol: HTTPS
      port: 8443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: tls-traefik
      allowedRoutes:
        namespaces:
          from: Same
