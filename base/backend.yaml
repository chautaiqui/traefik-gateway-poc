apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-v1
  namespace: traefik-poc
spec:
  replicas: 2
  selector:
    matchLabels: {app: echo-v1}
  template:
    metadata:
      labels: {app: echo-v1}
    spec:
      containers:
      - name: echo
        image: traefik/whoami:v1.11
        ports: [{containerPort: 80}]
        resources:
          requests: {cpu: 50m, memory: 32Mi}
          limits: {cpu: 250m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: echo-v1
  namespace: traefik-poc
spec:
  selector: {app: echo-v1}
  ports: [{name: http, port: 80, targetPort: 80}]
---
