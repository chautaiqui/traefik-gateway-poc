apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-poc-dashboard
  namespace: traefik-monitoring
  labels:
    grafana_dashboard: "1"
data:
  traefik-poc.json: |
    {
      "uid": "traefik-poc-performance",
      "title": "Traefik Gateway PoC / Performance",
      "tags": [
        "traefik",
        "benchmark",
        "poc"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "15s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Requests / sec",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(rate(traefik_entrypoint_requests_total{job=~\".*traefik.*\"}[2m]))",
              "refId": "A",
              "legendFormat": "{{code}} {{method}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "HTTP status rate",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum by (code) (rate(traefik_entrypoint_requests_total{job=~\".*traefik.*\"}[2m]))",
              "refId": "A",
              "legendFormat": "{{code}} {{method}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "p95 latency (seconds)",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(traefik_entrypoint_request_duration_seconds_bucket{job=~\".*traefik.*\"}[5m])))",
              "refId": "A",
              "legendFormat": "{{code}} {{method}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "p99 latency (seconds)",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum by (le) (rate(traefik_entrypoint_request_duration_seconds_bucket{job=~\".*traefik.*\"}[5m])))",
              "refId": "A",
              "legendFormat": "{{code}} {{method}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Traefik pod CPU cores",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 16
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"traefik-poc\",container!=\"\",image!=\"\"}[2m]))",
              "refId": "A",
              "legendFormat": "{{code}} {{method}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Traefik pod memory bytes",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 16
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{namespace=\"traefik-poc\",container!=\"\",image!=\"\"})",
              "refId": "A",
              "legendFormat": "{{code}} {{method}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Concurrent open connections",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 24
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(traefik_open_connections{job=~\".*traefik.*\"})",
              "refId": "A",
              "legendFormat": "{{code}} {{method}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "5xx rate",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 24
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(rate(traefik_entrypoint_requests_total{job=~\".*traefik.*\",code=~\"5..\"}[2m]))",
              "refId": "A",
              "legendFormat": "{{code}} {{method}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        }
      ]
    }
