# kube-prometheus-stack: lab-only isolated monitoring installation.
# Release: traefik-monitoring; namespace: traefik-monitoring.
grafana:
  enabled: true
  adminUser: admin
  # Password is generated by chart into Kubernetes Secret; never commit plaintext.
  service:
    type: ClusterIP
  persistence:
    enabled: false
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: '1'
      searchNamespace: ALL
prometheus:
  service:
    type: ClusterIP
  prometheusSpec:
    retention: 3d
    scrapeInterval: 15s
    evaluationInterval: 15s
    # Explicitly select ServiceMonitors carrying the release label.
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector:
      matchLabels:
        release: traefik-monitoring
    serviceMonitorNamespaceSelector: {}
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: '2'
        memory: 2Gi
    storageSpec: {}
alertmanager:
  enabled: false
# k3s usually does not expose these components on standard scrape endpoints.
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
