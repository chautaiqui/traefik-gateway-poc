deployment:
  replicas: 2
providers:
  kubernetesIngress:
    enabled: false
  kubernetesCRD:
    enabled: true
  kubernetesGateway:
    enabled: true
gateway:
  enabled: false
service:
  spec:
    type: ClusterIP
ports:
  web:
    port: 8000
    expose:
      default: true
    exposedPort: 80
  websecure:
    port: 8443
    expose:
      default: true
    exposedPort: 443
  # F66 TCP routing — a raw TCP entrypoint for a Gateway TCP listener/TCPRoute.
  tcpep:
    port: 9200
    protocol: TCP
    expose:
      default: true
    exposedPort: 9200
# HTTP/connection telemetry. The metrics service is ClusterIP-only.
metrics:
  prometheus:
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true
    buckets: '0.005,0.01,0.025,0.05,0.1,0.25,0.5,1,2,5,10'
    service:
      enabled: true
    serviceMonitor:
      enabled: true
      interval: 15s
      additionalLabels:
        release: traefik-monitoring
accessLog:
  enabled: true
  format: json
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: '2'
    memory: 1Gi

# Internal dashboard: only reachable through ClusterIP + kubectl port-forward.
api:
  dashboard: true
  insecure: false
ingressRoute:
  dashboard:
    enabled: true
    # Path-only match so the dashboard opens at http://localhost:<pf-port>/dashboard/
    # without a Host header / hosts-file entry. Safe because the Service is ClusterIP
    # and only reachable via local kubectl port-forward (not exposed publicly).
    matchRule: 'PathPrefix(`/dashboard`) || PathPrefix(`/api`)'
    entryPoints:
      - web
