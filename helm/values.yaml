deployment:
  replicas: 2
providers:
  kubernetesIngress:
    enabled: false
  kubernetesCRD:
    enabled: true
  kubernetesGateway:
    enabled: true
gateway:
  enabled: false
service:
  type: ClusterIP
ports:
  web:
    port: 8000
    expose:
      default: true
    exposedPort: 80
  websecure:
    port: 8443
    expose:
      default: true
    exposedPort: 443
metrics:
  prometheus: {}
logs:
  access:
    enabled: true
    format: json
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: '2'
    memory: 1Gi
