apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo
  namespace: traefik-poc
spec:
  parentRefs: [{name: traefik-poc, sectionName: http}]
  hostnames: [echo.traefik.test]
  rules:
  - matches:
    - path: {type: PathPrefix, value: /}
    backendRefs: [{name: echo-v1, port: 80}]
