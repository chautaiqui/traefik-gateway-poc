# F07 HTTP timeouts — Gateway API HTTPRoute `timeouts` (OSS).
# request timeout 1s against go-httpbin /delay/3 -> upstream exceeds timeout.
#   kubectl -n traefik-poc create deployment httpbin --image=mccutchen/go-httpbin:v2.15.0 --port=8080
#   kubectl -n traefik-poc expose deployment httpbin --port=80 --target-port=8080
# OBSERVED (Traefik v3.7.17): timeouts.request=1s is NOT enforced -> /delay/3
# returns 200 after 3.0s. Gateway API route timeouts not honored; use Traefik
# entrypoint respondingTimeouts instead. Recorded as FAIL in docs/feature-matrix.csv.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: timeout
  namespace: traefik-poc
spec:
  parentRefs: [{name: traefik-poc, sectionName: http}]
  hostnames: [timeout.traefik.test]
  rules:
  - timeouts:
      request: 1s
    backendRefs: [{name: httpbin, port: 80}]
