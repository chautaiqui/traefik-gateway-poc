# F45 CORS — Traefik OSS Middleware `headers` (accessControl* fields)
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: cors
  namespace: traefik-poc
spec:
  headers:
    accessControlAllowMethods: [GET, POST, OPTIONS]
    accessControlAllowOriginList:
      - https://poc.example.com
    accessControlAllowHeaders: [Content-Type, Authorization]
    accessControlMaxAge: 600
    addVaryHeader: true
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cors
  namespace: traefik-poc
spec:
  parentRefs: [{name: traefik-poc, sectionName: http}]
  hostnames: [cors.traefik.test]
  rules:
  - filters:
    - type: ExtensionRef
      extensionRef: {group: traefik.io, kind: Middleware, name: cors}
    backendRefs: [{name: echo-v1, port: 80}]
