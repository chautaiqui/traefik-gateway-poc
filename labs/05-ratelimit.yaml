apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: local-rate-limit
  namespace: traefik-poc
spec:
  rateLimit:
    average: 5
    burst: 10
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ratelimit
  namespace: traefik-poc
spec:
  parentRefs: [{name: traefik-poc, sectionName: http}]
  hostnames: [ratelimit.traefik.test]
  rules:
  - filters:
    - type: ExtensionRef
      extensionRef: {group: traefik.io, kind: Middleware, name: local-rate-limit}
    backendRefs: [{name: echo-v1, port: 80}]
