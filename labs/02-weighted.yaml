apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: weighted
  namespace: traefik-poc
spec:
  parentRefs: [{name: traefik-poc, sectionName: http}]
  hostnames: [weighted.traefik.test]
  rules:
  - backendRefs:
    - {name: echo-v1, port: 80, weight: 90}
    - {name: echo-v2, port: 80, weight: 10}
