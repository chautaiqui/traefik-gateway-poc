# F39 Response compression — Traefik OSS Middleware `compress`
# minResponseBodyBytes=1 so the small echo body still compresses (default is 1024).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: compress
  namespace: traefik-poc
spec:
  compress:
    minResponseBodyBytes: 1
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: compress
  namespace: traefik-poc
spec:
  parentRefs: [{name: traefik-poc, sectionName: http}]
  hostnames: [compress.traefik.test]
  rules:
  - filters:
    - type: ExtensionRef
      extensionRef: {group: traefik.io, kind: Middleware, name: compress}
    backendRefs: [{name: echo-v1, port: 80}]
