# F66 TCP routing — Gateway API TCPRoute (experimental CRD) to a raw TCP backend.
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata: {name: tcp-echo, namespace: traefik-poc}
spec:
  parentRefs: [{name: traefik-poc, sectionName: tcp}]
  rules:
  - backendRefs: [{name: tcp-echo, port: 9000}]
