apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headers
  namespace: traefik-poc
spec:
  parentRefs: [{name: traefik-poc, sectionName: http}]
  hostnames: [headers.traefik.test]
  rules:
  - filters:
    - type: RequestHeaderModifier
      requestHeaderModifier:
        set: [{name: X-PoC-Gateway, value: traefik}]
    - type: ResponseHeaderModifier
      responseHeaderModifier:
        set: [{name: X-PoC-Response, value: traefik}]
    backendRefs: [{name: echo-v1, port: 80}]
