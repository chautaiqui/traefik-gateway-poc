# F62 Basic authentication — Traefik OSS Middleware `basicAuth`
# Requires a Secret `basic-auth-users` with key `users` (htpasswd format).
# Create it with (user=poc):
#   htpasswd -nbB poc 'poc123' > /tmp/users   # or: openssl passwd -apr1
#   kubectl -n traefik-poc create secret generic basic-auth-users --from-file=users=/tmp/users
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: basic-auth
  namespace: traefik-poc
spec:
  basicAuth:
    secret: basic-auth-users
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: basicauth
  namespace: traefik-poc
spec:
  parentRefs: [{name: traefik-poc, sectionName: http}]
  hostnames: [auth.traefik.test]
  rules:
  - filters:
    - type: ExtensionRef
      extensionRef: {group: traefik.io, kind: Middleware, name: basic-auth}
    backendRefs: [{name: echo-v1, port: 80}]
